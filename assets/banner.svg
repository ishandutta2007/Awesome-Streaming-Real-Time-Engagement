<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="waveGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".2"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".3"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/></linearGradient></defs><style>@keyframes floatWave{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulseParticle{0%{opacity:.3}50%{opacity:.8}}@keyframes flowLine{0%{stroke-dashoffset:1000}}.title{font-weight:800;font-size:38px;fill:url(#titleGrad)}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.subtitle{font-weight:500;font-size:19px;fill:url(#subGrad);letter-spacing:1px}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.animated-wave{animation:floatWave 8s ease-in-out infinite}.animated-particle{animation:pulseParticle 4s ease-in-out infinite}.animated-flow{stroke-dasharray:20,10;animation:flowLine 25s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1196" height="316" x="2" y="2" fill="none" stroke="url(#titleGrad)"