<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: url(#subGrad); letter-spacing: 1.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes floatWave {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-12px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    @keyframes pulseParticle {
      0% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.8; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-wave { animation: floatWave 8s ease-in-out infinite; transform-origin: center; }
    .animated-particle { animation: pulseParticle 4s ease-in-out infinite; }
    .animated-flow { stroke-dasharray: 20, 10; animation: flowLine 25s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Dynamic/Animated Background Graphics (Kept strictly behind foreground text) -->
  <g class="animated-wave">
    <path d="M0,220 Q300,160 600,230 T1200,190 L1200,320 L0,320 Z" fill="url(#waveGrad)" />
  </g>
  <g class="animated-particle">
    <circle cx="150" cy="80" r="3" fill="#38bdf8" />
    <circle cx="280" cy="240" r="4" fill="#818cf8" />
    <circle cx="950" cy="70" r="3.5" fill="#c084fc" />
    <circle cx="1080" cy="230" r="5" fill="#f43f5e" />
    <circle cx="800" cy="260" r="2.5" fill="#38bdf8" />
  </g>
  <path d="M -50 250 Q 300 120 600 240 T 1250 180" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="animated-flow" />

  <!-- Grid & Tech Motifs Background -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="320" stroke="#fff" stroke-dasharray="4,4"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#fff" stroke-dasharray="4,4"/>
    <line x1="900" y1="0" x2="900" y2="320" stroke="#fff" stroke-dasharray="4,4"/>
    <line x1="1100" y1="0" x2="1100" y2="320" stroke="#fff" stroke-dasharray="4,4"/>
  </g>

  <!-- Foreground Content (Guaranteed text visibility) -->
  <g id="ForegroundContent">
    <!-- Top Pill Badge -->
    <g transform="translate(470, 42)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="130" y="21" text-anchor="middle" class="badge-text">⚡ REAL-TIME ENGAGEMENT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" class="title" filter="url(#glow)">Awesome Streaming Real-Time Engagement 🚀</text>

    <!-- Subtitle -->
    <text x="600" y="176" text-anchor="middle" class="subtitle">Live Video • WebRTC • Audio &amp; Voice • Pub/Sub Messaging • Infrastructure APIs</text>

    <!-- Feature Highlights -->
    <g transform="translate(600, 240)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1">
        🎥 WebRTC SFU &amp; MCU &nbsp;•&nbsp; 📡 Sub-Second Latency &nbsp;•&nbsp; 🤖 AI Voice &amp; Video Agents &nbsp;•&nbsp; ⚡ Open-Source &amp; SaaS
      </text>
    </g>
  </g>
</svg>
